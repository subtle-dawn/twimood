<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimood グラフ</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
<style>
  body {
    margin: 0;
    padding-bottom: 56px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 1rem;
    overflow: hidden;
  }

  .container,
  .btn-group {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
  }

  #prev-btn,
  #next-btn {
    width: 33.33%;
  }

  #chart-container {
    display: flex;
    justify-content: center;
    width: 100%;
    min-height: 240px;
  }

  #emotionChart {
    width: 100% !important;
    height: 100% !important;
  }

  /* スマホ横向き（ランドスケープ）時のグラフ最適化 */
  @media screen and (orientation: landscape) and (max-width: 768px) {
    body {
      height: calc(var(--vh, 1vh) * 100);
      padding-bottom: 0;
    }

    #chart-container {
      width: 100%;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="btn-group" role="group" id="unit-selector">
      <button class="btn btn-outline-primary" data-unit="year">年</button>
      <button class="btn btn-outline-primary active" data-unit="month">月</button>
      <button class="btn btn-outline-primary" data-unit="week">週</button>
    </div>
  
    <div class="d-flex justify-content-between">
      <button class="btn btn-outline-secondary" id="prev-btn">← 前</button>
      <button id="current-range" class="text-center fw-bold btn btn-link text-decoration-none"></button>
      <button class="btn btn-outline-secondary" id="next-btn">次 →</button>
    </div>
  </div>
  
<div id="chart-container">
  <canvas id="emotionChart"></canvas>
</div>

{% include "twimood/_navbar.html" %}

<script>
document.addEventListener('DOMContentLoaded', function () {
  Chart.defaults.font.size = 16;

  const ctx = document.getElementById('emotionChart').getContext('2d');

  const emotionChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: []
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      spanGaps: false,
      scales: {
        x: {
          ticks: {
            callback(value) {
              const label = this.getLabelForValue(value);
              return formatAxisLabel(label);
            }
          }
        },
        y: {
          beginAtZero: true,
          suggestedMin: -10,
          suggestedMax: 10
        }
      },
      plugins: {
        sundayLines: true,  // ✅ カスタムオプション（任意の名前）
        zeroLines: true
      }
    },
    plugins: [{
      id: 'sundayLines',
      afterDatasetsDraw(chart, args, options) {
        if (typeof currentUnit === 'undefined' || currentUnit !== 'month') return;

        const {ctx, chartArea: {left, right, top, bottom}, scales: {x}} = chart;
        const labels = chart.data.labels;

        if (!labels || labels.length === 0) return;

        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;

        labels.forEach((label, i) => {
          const dateStr = label.split(' ')[0];
          const date = new Date(dateStr);
          if (date.getDay() === 0) {
            const xPos = x.getPixelForValue(i) + 0.5;
            ctx.beginPath();
            ctx.moveTo(xPos, top);
            ctx.lineTo(xPos, bottom);
            ctx.stroke();
          }
        });

        ctx.restore();
      }
    },
    {
      id: 'zeroLine',
      afterDraw(chart) {
        const yAxis = chart.scales.y;
        const zeroY = yAxis.getPixelForValue(0);
        const ctx = chart.ctx;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(chart.chartArea.left, zeroY);
        ctx.lineTo(chart.chartArea.right, zeroY);
        ctx.lineWidth = 1; // 太さ（必要に応じて調整）
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; // 色（濃いグレー）
        ctx.stroke();
        ctx.restore();
      }
    }]
  });

  // ✅ 表示単位と期間の状態
  window.currentUnit = 'month';  // 'year' / 'month' / 'week'
  let currentDate = new Date();  // 現在中心の日付

  // ✅ ボタンで unit 切り替え
  document.querySelectorAll('#unit-selector button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentUnit = btn.dataset.unit;
      document.querySelectorAll('#unit-selector button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fetchGraphData();
    });
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    shiftDate(-1);
    fetchGraphData();
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    shiftDate(1);
    fetchGraphData();
  });

  function shiftDate(step) {
    if (currentUnit === 'year') {
      currentDate.setFullYear(currentDate.getFullYear() + step);
    } else if (currentUnit === 'month') {
      currentDate.setMonth(currentDate.getMonth() + step);
    } else if (currentUnit === 'week') {
      currentDate.setDate(currentDate.getDate() + step * 7);
    }
  }

  function formatRangeLabel() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth() + 1;
    const d = currentDate.getDate();
    if (currentUnit === 'year') return `${y}年`;
    if (currentUnit === 'month') return `${y}年${m}月`;
    if (currentUnit === 'week') {
      const start = new Date(currentDate);
      start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      const end = new Date(currentDate);
      end.setTime(start.getTime());
      end.setDate(start.getDate() + 6);
      return `${start.getMonth() + 1}/${start.getDate()}〜${end.getMonth() + 1}/${end.getDate()}`;
    }
  }

  function formatAxisLabel(label) {
    const datePart = String(label).split(' ')[0];
    const parts = datePart.split('-');

    if (currentUnit === 'year') {
      return parts[1] ? `${Number(parts[1])}月` : label;
    }

    if (currentUnit === 'week') {
      const weekday = String(label).match(/\(([^)]+)\)/)?.[1];
      return parts[2] ? `${Number(parts[2])}日${weekday ? `(${weekday})` : ''}` : label;
    }

    if (currentUnit === 'month') {
      return parts[2] ? `${Number(parts[2])}日` : label;
    }

    return label;
  }

  function fetchGraphData() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth() + 1;
    const d = currentDate.getDate();

    const params = new URLSearchParams({
      unit: currentUnit,
      year: y,
      month: m,
      day: d
    });

    document.getElementById('current-range').textContent = formatRangeLabel();

    fetch(`/api/graphdata/?${params}`)
      .then(response => response.json())
      .then(data => {
        emotionChart.data.labels = data.labels;
        emotionChart.data.datasets = data.datasets;
        emotionChart.update();
      })
      .catch(error => {
        console.error('データ取得エラー:', error);
      });
  }

  document.getElementById("current-range").addEventListener("click", () => {
    currentDate = new Date();
    fetchGraphData();
  });

  fetchGraphData();  // 初期表示
});

function adjustChartHeight() {
  const vh = window.innerHeight;
  const unitSelector = document.getElementById('unit-selector');
  const navButtons = document.querySelector('.d-flex');
  const bottomNav = document.querySelector('.navbar.fixed-bottom');

  const unitHeight = unitSelector?.offsetHeight || 0;
  const navHeight = navButtons?.offsetHeight || 0;
  const bottomNavHeight = bottomNav && getComputedStyle(bottomNav).display !== 'none'
    ? bottomNav.offsetHeight
    : 0;

  // 合計差し引いて高さを設定
  const chartHeight = vh - unitHeight - navHeight - bottomNavHeight;

  const chartContainer = document.getElementById('chart-container');
  if (chartContainer) {
    chartContainer.style.height = `${Math.max(chartHeight, 240)}px`;
  }
}

window.addEventListener('resize', adjustChartHeight);
window.addEventListener('orientationchange', adjustChartHeight);
adjustChartHeight();  // 初期実行

</script>

</body>
</html>
