<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimood グラフ</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
  :root {
    --twimood-blue: #1DA1F2;
    --control-border: #d7e3ee;
    --control-bg: #f8fbff;
  }

  body {
    margin: 0;
    padding-bottom: 56px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 1rem;
    overflow: hidden;
    background: #ffffff;
  }

  .graph-shell {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0.65rem 0.75rem 0.5rem;
    border-bottom: 1px solid #edf2f7;
    background: #ffffff;
  }

  .graph-controls {
    display: grid;
    grid-template-columns: auto minmax(8rem, 1.15fr) minmax(6.5rem, 0.85fr) auto;
    gap: 0.45rem;
    align-items: center;
  }

  .control-select,
  .nav-button,
  .date-button {
    min-height: 2.55rem;
    border-radius: 0.5rem;
  }

  .control-select {
    border-color: var(--control-border);
    background-color: var(--control-bg);
    font-weight: 700;
  }

  .nav-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    border-color: var(--control-border);
    color: #28465c;
    background: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
  }

  .nav-button svg {
    width: 1em;
    height: 1em;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.4;
  }

  .nav-button:hover,
  .date-button:hover {
    border-color: var(--twimood-blue);
    color: #0f6da8;
    background: #f2f9ff;
  }

  .date-picker-wrap {
    position: relative;
    min-width: 0;
  }

  .date-button {
    width: 100%;
    border: 1px solid var(--control-border);
    color: #12324a;
    background: #ffffff;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .native-date-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }

  #chart-container {
    display: flex;
    justify-content: center;
    width: 100%;
    min-height: 240px;
  }

  #emotionChart {
    width: 100% !important;
    height: 100% !important;
  }

  @media (max-width: 575px) {
    .graph-shell {
      padding: 0.55rem 0.5rem 0.45rem;
    }

    .date-picker-wrap {
      min-width: 9rem;
    }

    .nav-button {
      font-size: 0.9rem;
    }
  }

  @media screen and (orientation: landscape) and (max-width: 768px) {
    body {
      height: calc(var(--vh, 1vh) * 100);
      padding-bottom: 0;
    }

    .graph-shell {
      padding-top: 0.4rem;
      padding-bottom: 0.35rem;
    }
  }
</style>
</head>
<body>

  <div class="graph-shell">
    <div class="graph-controls" id="graph-controls">
      <button class="btn nav-button" id="prev-btn" type="button" aria-label="前へ">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>

      <div class="date-picker-wrap" id="date-picker-wrap">
        <button id="current-range" class="btn date-button" type="button" aria-label="日付を選択"></button>
        <input class="native-date-input" id="calendar-input" type="date" tabindex="-1" aria-hidden="true">
      </div>

      <select class="form-select control-select" id="period-select" aria-label="表示期間">
        <option value="year">年</option>
        <option value="month" selected>月</option>
        <option value="week">週</option>
      </select>

      <button class="btn nav-button" id="next-btn" type="button" aria-label="次へ">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>
  </div>

<div id="chart-container">
  <canvas id="emotionChart"></canvas>
</div>

{% include "twimood/_navbar.html" %}

<script>
document.addEventListener('DOMContentLoaded', function () {
  Chart.defaults.font.size = 16;

  const ctx = document.getElementById('emotionChart').getContext('2d');
  const periodSelect = document.getElementById('period-select');
  const currentRangeButton = document.getElementById('current-range');
  const calendarInput = document.getElementById('calendar-input');

  const emotionChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: []
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      spanGaps: false,
      scales: {
        x: {
          ticks: {
            callback(value) {
              const label = this.getLabelForValue(value);
              return formatAxisLabel(label);
            }
          }
        },
        y: {
          beginAtZero: true,
          suggestedMin: -10,
          suggestedMax: 10
        }
      },
      plugins: {
        mondayLines: true,
        zeroLines: true
      }
    },
    plugins: [{
      id: 'mondayLines',
      afterDatasetsDraw(chart) {
        if (typeof currentUnit === 'undefined' || !['month', 'week'].includes(currentUnit)) return;

        const {ctx, chartArea: {top, bottom}, scales: {x}} = chart;
        const labels = chart.data.labels;

        if (!labels || labels.length === 0) return;

        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;

        labels.forEach((label, i) => {
          const dateStr = label.split(' ')[0];
          const date = new Date(dateStr);
          if (date.getDay() === 1) {
            const xPos = x.getPixelForValue(i) + 0.5;
            ctx.beginPath();
            ctx.moveTo(xPos, top);
            ctx.lineTo(xPos, bottom);
            ctx.stroke();
          }
        });

        ctx.restore();
      }
    },
    {
      id: 'zeroLine',
      afterDraw(chart) {
        const yAxis = chart.scales.y;
        const zeroY = yAxis.getPixelForValue(0);
        const ctx = chart.ctx;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(chart.chartArea.left, zeroY);
        ctx.lineTo(chart.chartArea.right, zeroY);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.stroke();
        ctx.restore();
      }
    }]
  });

  window.currentUnit = 'month';
  let currentDate = parseInputDate('{{ today|escapejs }}');

  periodSelect.addEventListener('change', () => {
    currentUnit = periodSelect.value;
    fetchGraphData();
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    shiftDate(-1);
    fetchGraphData();
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    shiftDate(1);
    fetchGraphData();
  });

  currentRangeButton.addEventListener('click', () => {
    calendarInput.focus();
    if (typeof calendarInput.showPicker === 'function') {
      calendarInput.showPicker();
    } else {
      calendarInput.click();
    }
  });

  calendarInput.addEventListener('change', () => {
    if (!calendarInput.value) return;
    currentDate = parseInputDate(calendarInput.value);
    fetchGraphData();
  });

  function shiftDate(step) {
    const nextDate = new Date(currentDate);
    if (currentUnit === 'year') {
      nextDate.setFullYear(nextDate.getFullYear() + step);
    } else if (currentUnit === 'month') {
      nextDate.setMonth(nextDate.getMonth() + step);
    } else if (currentUnit === 'week') {
      nextDate.setDate(nextDate.getDate() + step * 7);
    }
    currentDate = nextDate;
  }

  function formatRangeLabel() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth() + 1;

    if (currentUnit === 'year') {
      const start = new Date(currentDate.getFullYear(), currentDate.getMonth() - 11, 1);
      return `${start.getFullYear()}/${start.getMonth() + 1} - ${y}/${m}`;
    }

    if (currentUnit === 'month') {
      const start = new Date(currentDate);
      start.setMonth(currentDate.getMonth() - 1);
      start.setDate(currentDate.getDate() + 1);
      return `${formatDateWithYear(start)} - ${formatDateWithYear(currentDate)}`;
    }

    const start = new Date(currentDate);
    start.setDate(currentDate.getDate() - 6);
    return `${formatDateWithYear(start)} - ${formatDateWithYear(currentDate)}`;
  }

  function formatAxisLabel(label) {
    const datePart = String(label).split(' ')[0];
    const parts = datePart.split('-');

    if (currentUnit === 'year') {
      return parts[1] ? `${Number(parts[1])}月` : label;
    }

    if (currentUnit === 'week') {
      const weekday = String(label).match(/\(([^)]+)\)/)?.[1];
      return parts[2] ? `${Number(parts[2])}日${weekday ? `(${weekday})` : ''}` : label;
    }

    if (currentUnit === 'month') {
      return parts[2] ? `${Number(parts[2])}日` : label;
    }

    return label;
  }

  function formatDateWithYear(date) {
    return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
  }

  function formatInputDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function parseInputDate(value) {
    const [year, month, day] = value.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function fetchGraphData() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth() + 1;
    const d = currentDate.getDate();

    const params = new URLSearchParams({
      unit: currentUnit,
      year: y,
      month: m,
      day: d
    });

    currentRangeButton.textContent = formatRangeLabel();
    calendarInput.value = formatInputDate(currentDate);

    fetch(`/api/graphdata/?${params}`)
      .then(response => response.json())
      .then(data => {
        emotionChart.data.labels = data.labels;
        emotionChart.data.datasets = data.datasets;
        emotionChart.update();
        adjustChartHeight();
      })
      .catch(error => {
        console.error('データ取得エラー:', error);
      });
  }

  fetchGraphData();
});

function adjustChartHeight() {
  const vh = window.innerHeight;
  const graphShell = document.querySelector('.graph-shell');
  const bottomNav = document.querySelector('.navbar.fixed-bottom');

  const controlsHeight = graphShell?.offsetHeight || 0;
  const bottomNavHeight = bottomNav && getComputedStyle(bottomNav).display !== 'none'
    ? bottomNav.offsetHeight
    : 0;

  const chartHeight = vh - controlsHeight - bottomNavHeight;

  const chartContainer = document.getElementById('chart-container');
  if (chartContainer) {
    chartContainer.style.height = `${Math.max(chartHeight, 240)}px`;
  }
}

window.addEventListener('resize', adjustChartHeight);
window.addEventListener('orientationchange', adjustChartHeight);
adjustChartHeight();
</script>

</body>
</html>
