<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimood カレンダー</title>

  <!-- FullCalendarのCSSとJS（CDNから確実に読み込む） -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales-all.global.min.js"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
  :root {
    --twimood-blue: #1DA1F2;
    --twimood-blue-dark: #168bd1;
    --control-border: #d7e3ee;
    --control-bg: #f8fbff;
    --ink: #12324a;
    --bottom-nav-height: 0px;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f8fb;
    color: var(--ink);
    width: 100%;
    overflow-x: hidden;
    font-size: 1rem;  /* = 16px */
  }

  /* カレンダー本体 */
  #calendar {
    width: 100%;
    max-width: 100%;
    height: calc(var(--vh, 1vh) * 100 - var(--bottom-nav-height));
    margin: 0 auto;
    font-size: 1rem;
    background: #ffffff;
  }

  /* カレンダーのヘッダー */
  .fc .fc-header-toolbar{
    display: flex;
    gap: 0.45rem;
    align-items: center;
    justify-content: center;
    padding: 0.65rem 0.75rem 0.5rem;
    background-color: #ffffff;
    border-bottom: 1px solid #edf2f7;
    margin-bottom: 0 !important;
  }

  /* カレンダーのタイトル */
  .fc .fc-toolbar-title{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 2.55rem;
    min-width: 0;
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--control-border);
    border-radius: 0.5rem;
    background: #ffffff;
    margin-left: 0 !important;
    color: var(--ink);
    font-size: 1rem !important;
    font-weight: 800;
    letter-spacing: 0;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .fc .fc-toolbar-title:hover,
  .fc .fc-toolbar-title:focus {
    border-color: var(--twimood-blue);
    color: #0f6da8;
    background: #f2f9ff;
  }

  /* カレンダーのボタン */
  .fc .fc-toolbar-chunk {
    display: grid;
    grid-template-columns: auto minmax(8rem, 1.15fr) minmax(6.5rem, 0.85fr) auto;
    align-items: center;
    gap: 0.45rem;
    width: 100%;
    min-width: 0;
  }

  .fc .fc-toolbar-chunk:empty {
    display: none;
  }

  .fc .fc-button-group {
    gap: 0.25rem;
  }

  .fc .fc-button{
    min-height: 2.55rem;
    border-radius: 0.5rem !important;
    font-size: 1rem !important;
    font-weight: 700 !important;
    line-height: 1 !important;
    box-shadow: none !important;
  }

  .fc .fc-prev-button svg,
  .fc .fc-next-button svg {
    width: 1.45rem;
    height: 1.45rem;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.4;
  }

  .fc .fc-prev-button .fc-icon,
  .fc .fc-next-button .fc-icon {
    display: none;
  }

  .fc-button-primary {
    background-color: #ffffff !important;
    border-color: var(--control-border) !important;
    color: #28465c !important;
    padding: 0.45rem 0.75rem !important;
  }

  .fc-button-primary:hover,
  .fc-button-primary:focus {
    background-color: #f2f9ff !important;
    border-color: var(--twimood-blue) !important;
    color: #0f6da8 !important;
  }

  .fc-button-primary:not(:disabled).fc-button-active,
  .fc-button-primary:not(:disabled):active,
  .fc .fc-modeToggle-button {
    background-color: var(--twimood-blue) !important;
    border-color: var(--twimood-blue) !important;
    color: #fff !important;
  }

  .fc .fc-modeToggle-button:hover,
  .fc .fc-modeToggle-button:focus {
    background-color: var(--twimood-blue-dark) !important;
    border-color: var(--twimood-blue-dark) !important;
    color: #fff !important;
  }

  .fc .fc-prev-button,
  .fc .fc-next-button {
    width: 2.75rem;
    padding-inline: 0 !important;
  }

  .fc-theme-standard td,
  .fc-theme-standard th,
  .fc-theme-standard .fc-scrollgrid {
    border-color: #e7eef5;
  }

  /* カレンダー内の日付数字 */
  .fc .fc-daygrid-day-number {
    font-size: 1.1rem;
    color: inherit;
    text-decoration: none;
  }

  .fc .fc-daygrid-day-number:hover {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  /* 曜日（Sun / Mon ...） */
  .fc .fc-col-header-cell-cushion {
    font-size: 1rem;
    color: inherit;
    text-decoration: none;
    cursor: default;
  }

  /* カレンダーイベントタイトル */
  .fc .fc-event-title {
    font-size: 1rem;
  }

  .modal-dialog {
    max-width: 95vw;
  }

  /* モーダルの本文のリスト */
  .modal-body ul {
    padding-left: 1rem;
    font-size: 1rem;
  }

  .modal-body li {
    margin-bottom: 1rem;
    line-height: 1.5;
  }

  /* スマホ用 */
  @media (max-width: 991px) {
    .fc .fc-header-toolbar {
      padding: 0.55rem 0.5rem 0.45rem;
    }

    .fc .fc-header-toolbar .fc-toolbar-chunk:first-child {
      grid-template-columns: auto minmax(7rem, 1.15fr) minmax(4.8rem, 0.85fr) auto;
      gap: 0.35rem;
    }

    .fc .fc-toolbar-title{
      min-height: 2.55rem;
      padding: 0.375rem 0.55rem;
      font-size: 1rem !important;
    }

    .fc .fc-button {
      min-height: 2.55rem;
      font-size: 0.9rem !important;
      padding: 0.375rem 0.55rem !important;
    }

    .fc .fc-prev-button,
    .fc .fc-next-button {
      width: 2.75rem;
    }
    
    .fc-event-title .label-text {
      display: none;
    }

}

</style>
</head>
<body>

  <div id="calendar"></div>
  
<!-- Bootstrapモーダル -->
<div class="modal fade" id="tweetModal" tabindex="-1" aria-labelledby="tweetModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tweetModalLabel">該当ツイート一覧</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body" id="modal_content">
        <!-- ツイート一覧がここに入る -->
      </div>
    </div>
  </div>
</div>

{% include "twimood/_navbar.html" %}

<script>
  const emojiMap = {
    "喜び": "😊", "怒り": "😡", "悲しみ": "😢", "不安": "😰", "無気力": "😶",
    "躁": "😆", "鬱": "🥀", "その他": "🤔", "忘れ物": "👜", "不眠": "🌙",
    "過集中": "🎯", "風呂に入った": "🛁", "風呂に入らなかった": "🚫🛁", "旅行": "🧳",
    "友だちと遊んだ": "🎉", "希死念慮": "💀", "学校・仕事を休んだ": "🏫🚫",
    "体調不良": "🤒", "衝動買い": "🛒", "失くし物": "🔍",
    "買い物": "🛒", "欲求": "🔥", "不快": "😖"
  };

  let displayMode = "detailed"; // 初期状態：詳細表示
  let calendar; // ✅ グローバル変数に定義！
  
  function setLayoutVars() {
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);

    const bottomNav = document.querySelector('.navbar.fixed-bottom');
    const bottomNavHeight = bottomNav && getComputedStyle(bottomNav).display !== 'none'
      ? bottomNav.offsetHeight
      : 0;
    document.documentElement.style.setProperty('--bottom-nav-height', `${bottomNavHeight}px`);

    if (calendar) {
      calendar.updateSize();
    }
  }

  function updateCalendarTitle(date) {
    const titleEl = document.querySelector('.fc-toolbar-title');
    if (!titleEl || !date) return;

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    titleEl.textContent = `${year}/${month}`;
    titleEl.setAttribute('role', 'button');
    titleEl.setAttribute('tabindex', '0');
    titleEl.setAttribute('aria-label', '今日を表示');

    if (!titleEl.dataset.todayBound) {
      titleEl.dataset.todayBound = 'true';
      titleEl.addEventListener('click', () => calendar.today());
      titleEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          calendar.today();
        }
      });
    }
  }

  function setCalendarNavIcons() {
    const prevButton = document.querySelector('.fc-prev-button');
    const nextButton = document.querySelector('.fc-next-button');

    if (prevButton && !prevButton.querySelector('svg')) {
      prevButton.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      `;
    }

    if (nextButton && !nextButton.querySelector('svg')) {
      nextButton.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      `;
    }
  }
  
  document.addEventListener('DOMContentLoaded', function () {
    setLayoutVars();
  
    setTimeout(() => {
      const calendarEl = document.getElementById('calendar');

      const modeToggleClick = function () {
        displayMode = displayMode === "detailed" ? "simple" : "detailed";

        calendar.setOption("customButtons", {
          modeToggle: {
            text: displayMode === "detailed" ? "詳細" : "簡略",
            click: modeToggleClick
          }
        });
          // ✅ イベント再取得
          calendar.refetchEvents();

          const currentView = calendar.view.type;
          calendar.changeView(currentView); // ←これが表示更新のトリガーになる！
      };

      calendar = new FullCalendar.Calendar(calendarEl, {  // ✅ ← ここで代入！
        initialView: 'dayGridMonth',
        locale: 'ja',
        events: function (info, successCallback, failureCallback) {
          fetch(`/api/events/?mode=${displayMode}`)
            .then(response => response.json())
            .then(data => successCallback(data))
            .catch(err => failureCallback(err));
        },

        customButtons: {
          modeToggle: {
            text: '詳細',
            click: modeToggleClick
          }
        },

        headerToolbar: {
          left: 'prev title modeToggle next',
          center: '',
          right: ''
        },

        datesSet: function (info) {
          setCalendarNavIcons();
          updateCalendarTitle(info.view.currentStart);
        },

        eventDidMount: function(info) {
          const emoji = info.event.extendedProps.emoji || "❓";
          const label = info.event.extendedProps.label || "";
          const count = info.event.extendedProps.count ?? "";

          const el = info.el.querySelector('.fc-event-title');
          if (el) {
            // ✨ ラベルを<span>で囲んで挟む
            el.innerHTML = `${emoji}<span class="label-text">${label}</span>：${count}`;
          }
        },

        eventOrder: function (a, b) {
          const orderA = a.extendedProps?.sort_order ?? 999;
          const orderB = b.extendedProps?.sort_order ?? 999;
          return orderA - orderB;
        },

        eventClick: function (info) {
          const dateRaw = info.event.start;
          const emoji = info.event.extendedProps.emoji || "❓";
          const label = info.event.extendedProps.label || "";
          const count = info.event.extendedProps.count ?? "";

          const y = dateRaw.getFullYear();
          const m = dateRaw.getMonth() + 1;
          const d = dateRaw.getDate();
          const dateStr = `${y}年${m}月${d}日`;

          const title = `${dateStr}の ${emoji} ${label} のツイート一覧`;
          document.getElementById("tweetModalLabel").textContent = title;

          const date = info.event.startStr;
          const labelForApi = (displayMode === "simple") ? (emoji + label) : label;

          fetch(`/api/tweets/?date=${date}&label=${encodeURIComponent(labelForApi)}&mode=${displayMode}`)

            .then(res => res.json())
            .then(data => {
              let contentHtml = "";

              if (data.mode === "detailed") {
                // 🔹 詳細表示モード → 箇条書き
                const list = data.tweets.map(t =>
                  `<li class="mb-2"><strong>${t.datetime}</strong><br>${t.text}</li>`
                ).join("");
                contentHtml = `<ul>${list}</ul>`;
              } else {
                // 簡略表示モード
                const rows = data.tweets.map(t => {
                  const timeOnly = t.datetime.slice(11);
                  const emotionWithEmoji = (t.labels || "")
                    .split(",")
                    .map(e => e.trim())
                    .filter(e => e)
                    .map(e => `${emojiMap[e] || ""}${e}`)
                    .join(", ");

                  return `
                    <tr>
                      <td>${timeOnly}</td>
                      <td>${t.text}</td>
                      <td>${emotionWithEmoji}</td>
                    </tr>`;
                }).join("");

                contentHtml = `
                  <table class="table table-sm">
                    <thead>
                      <tr><th>時間</th><th>ツイート</th><th>感情やエピソード</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                `;
              }

              document.getElementById("modal_content").innerHTML = contentHtml;
              const modal = new bootstrap.Modal(document.getElementById('tweetModal'));
              modal.show();
            });
        }
      });
      calendar.render();
      setCalendarNavIcons();
      updateCalendarTitle(calendar.view.currentStart);
      setLayoutVars();
    });
  });
  
  window.addEventListener('resize', setLayoutVars);
</script>
</body>
</html>
