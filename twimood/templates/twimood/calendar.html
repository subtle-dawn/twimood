<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Twimood カレンダー</title>

  <!-- FullCalendarのCSSとJS（CDNから確実に読み込む） -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales-all.global.min.js"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #fff;
    width: 100%;
    overflow-x: hidden;
    font-size: 1rem;  /* = 16px */
  }

  /* カレンダー本体 */
  #calendar {
    width: 100%;
    max-width: 100%;
    height: calc(var(--vh, 1vh) * 100 - 66px);
    margin: 0 auto;
    font-size: 1rem;
  }

  /* カレンダーのヘッダー */
  .fc-header-toolbar{
    background-color:#1DA1F2;
    margin-bottom: 0 !important;
  }

  /* カレンダーのタイトル */
  .fc-toolbar-title{
    margin-left: 1rem !important;
    color:white;
  }

  /* カレンダーのボタン */
  .fc-button{
    font-size: 1.5em !important;
  }

  .fc-button-primary {
  background-color: #1DA1F2 !important;
  border-color: #1DA1F2 !important;
  color: #fff !important;
  padding: 0.375rem 0.75rem;
  line-height: 1.5;
  border-radius: 0.375rem;
}

.fc-button-primary:hover {
  background-color: #1e87cd !important;
  border-color: #1e87cd !important;
}

  /* カレンダー内の日付数字 */
  .fc .fc-daygrid-day-number {
    font-size: 1.1rem;
    color: inherit;
    text-decoration: none;
  }

  .fc .fc-daygrid-day-number:hover {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  /* 曜日（Sun / Mon ...） */
  .fc .fc-col-header-cell-cushion {
    font-size: 1rem;
    color: inherit;
    text-decoration: none;
    cursor: default;
  }

  /* カレンダーイベントタイトル */
  .fc .fc-event-title {
    font-size: 1rem;
  }

  .modal-dialog {
    max-width: 95vw;
  }

  /* モーダルの本文のリスト */
  .modal-body ul {
    padding-left: 1rem;
    font-size: 1rem;
  }

  .modal-body li {
    margin-bottom: 1rem;
    line-height: 1.5;
  }

  /* スマホ用 */
  @media (max-width: 991px) {
    html {
      font-size: 32px;
    }

    .fc-toolbar-title{
      font-size: 1.2rem !important;
    }
    
    .fc-event-title .label-text {
      display: none;
    }

    #calendar {
      height: calc(var(--vh, 1vh) * 100 - 132px);
    }
}

</style>
</head>
<body>

  <div id="calendar"></div>
  
<!-- Bootstrapモーダル -->
<div class="modal fade" id="tweetModal" tabindex="-1" aria-labelledby="tweetModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tweetModalLabel">該当ツイート一覧</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body" id="modal_content">
        <!-- ツイート一覧がここに入る -->
      </div>
    </div>
  </div>
</div>

{% include "twimood/_navbar.html" %}

<script>
  const emojiMap = {
    "喜び": "😊", "怒り": "😡", "悲しみ": "😢", "不安": "😰", "無気力": "😶",
    "躁": "😆", "鬱": "🥀", "その他": "🤔", "忘れ物": "👜", "不眠": "🌙",
    "過集中": "🎯", "風呂に入った": "🛁", "風呂に入らなかった": "🚫🛁", "旅行": "🧳",
    "友だちと遊んだ": "🎉", "希死念慮": "💀", "学校・仕事を休んだ": "🏫🚫",
    "体調不良": "🤒", "衝動買い": "🛒", "失くし物": "🔍",
    "買い物": "🛒", "欲求": "🔥", "不快": "😖"
  };

  let displayMode = "detailed"; // 初期状態：詳細表示
  let calendar; // ✅ グローバル変数に定義！
  
  function setRealVh() {
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }
  
  document.addEventListener('DOMContentLoaded', function () {
    setRealVh();
  
    setTimeout(() => {
      const calendarEl = document.getElementById('calendar');

      const modeToggleClick = function () {
        displayMode = displayMode === "detailed" ? "simple" : "detailed";

        calendar.setOption("customButtons", {
          modeToggle: {
            text: displayMode === "detailed" ? "詳細" : "簡略",
            click: modeToggleClick
          }
        });
          // ✅ イベント再取得
          calendar.refetchEvents();

          const currentView = calendar.view.type;
          calendar.changeView(currentView); // ←これが表示更新のトリガーになる！
      };

      calendar = new FullCalendar.Calendar(calendarEl, {  // ✅ ← ここで代入！
        initialView: 'dayGridMonth',
        locale: 'ja',
        events: function (info, successCallback, failureCallback) {
          fetch(`/api/events/?mode=${displayMode}`)
            .then(response => response.json())
            .then(data => successCallback(data))
            .catch(err => failureCallback(err));
        },

        customButtons: {
          modeToggle: {
            text: '詳細',
            click: modeToggleClick
          }
        },

        headerToolbar: {
          left: 'title', // ← toggleボタンを左端に追加！
          center: '',
          right: 'modeToggle today prev,next'
        },

        eventDidMount: function(info) {
          const emoji = info.event.extendedProps.emoji || "❓";
          const label = info.event.extendedProps.label || "";
          const count = info.event.extendedProps.count ?? "";

          const el = info.el.querySelector('.fc-event-title');
          if (el) {
            // ✨ ラベルを<span>で囲んで挟む
            el.innerHTML = `${emoji}<span class="label-text">${label}</span>：${count}`;
          }
        },

        eventOrder: function (a, b) {
          const orderA = a.extendedProps?.sort_order ?? 999;
          const orderB = b.extendedProps?.sort_order ?? 999;
          return orderA - orderB;
        },

        eventClick: function (info) {
          const dateRaw = info.event.start;
          const emoji = info.event.extendedProps.emoji || "❓";
          const label = info.event.extendedProps.label || "";
          const count = info.event.extendedProps.count ?? "";

          const y = dateRaw.getFullYear();
          const m = dateRaw.getMonth() + 1;
          const d = dateRaw.getDate();
          const dateStr = `${y}年${m}月${d}日`;

          const title = `${dateStr}の ${emoji} ${label} のツイート一覧`;
          document.getElementById("tweetModalLabel").textContent = title;

          const date = info.event.startStr;
          const labelForApi = (displayMode === "simple") ? (emoji + label) : label;

          fetch(`/api/tweets/?date=${date}&label=${encodeURIComponent(labelForApi)}&mode=${displayMode}`)

            .then(res => res.json())
            .then(data => {
              let contentHtml = "";

              if (data.mode === "detailed") {
                // 🔹 詳細表示モード → 箇条書き
                const list = data.tweets.map(t =>
                  `<li class="mb-2"><strong>${t.datetime}</strong><br>${t.text}</li>`
                ).join("");
                contentHtml = `<ul>${list}</ul>`;
              } else {
                // 簡略表示モード
                const rows = data.tweets.map(t => {
                  const timeOnly = t.datetime.slice(11);
                  const emotionWithEmoji = (t.labels || "")
                    .split(",")
                    .map(e => e.trim())
                    .filter(e => e)
                    .map(e => `${emojiMap[e] || ""}${e}`)
                    .join(", ");

                  return `
                    <tr>
                      <td>${timeOnly}</td>
                      <td>${t.text}</td>
                      <td>${emotionWithEmoji}</td>
                    </tr>`;
                }).join("");

                contentHtml = `
                  <table class="table table-sm">
                    <thead>
                      <tr><th>時間</th><th>ツイート</th><th>感情やエピソード</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                `;
              }

              document.getElementById("modal_content").innerHTML = contentHtml;
              const modal = new bootstrap.Modal(document.getElementById('tweetModal'));
              modal.show();
            });
        }
      });
      calendar.render();
    });
  });
  
  window.addEventListener('resize', setRealVh);
</script>
</body>
</html>
