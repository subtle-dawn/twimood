<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimood データ取得</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 60px;
      background: #f6f8fb;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 10px 0;
    }

    .panel {
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .lead {
      color: #526174;
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .status-item {
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 14px 16px;
      background: #fbfcfe;
    }

    .status-label {
      color: #64748b;
      font-size: 0.9rem;
    }

    .status-value {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .source-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .source-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 14px 16px;
      background: #fbfcfe;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .source-option:has(.form-check-input:checked) {
      border-color: #0d6efd;
      background: #f0f6ff;
    }

    .source-option .form-check-input {
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .source-option label {
      cursor: pointer;
      margin: 0;
    }

    .source-title {
      display: block;
      font-weight: 700;
    }

    .source-note {
      display: block;
      margin-top: 4px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .actions {
      margin-top: 1.5rem;
    }

    #get_data_button,
    #analyze_button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #analyze_button {
      margin-top: 12px;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1050;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(246, 248, 251, 0.86);
      backdrop-filter: blur(3px);
    }

    .loading-overlay.is-visible {
      display: flex;
      cursor: wait;
    }

    .loading-message {
      margin: 0;
      color: #0d6efd;
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      font-weight: 700;
      text-align: center;
    }

    .loading-overlay.is-analyzing .loading-message {
      color: #dc3545;
    }

    .loading-spinner {
      width: min(34vw, 180px);
      height: min(34vw, 180px);
      border: 16px solid rgba(13, 110, 253, 0.2);
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      box-shadow: 0 0 44px rgba(13, 110, 253, 0.26);
    }

    .loading-overlay.is-analyzing .loading-spinner {
      border-color: rgba(220, 53, 69, 0.2);
      border-top-color: #dc3545;
      box-shadow: 0 0 44px rgba(220, 53, 69, 0.26);
    }

    .loading-cancel {
      min-width: 180px;
    }

    .is-loading {
      pointer-events: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 920px);
        padding-top: 10px;
      }

      .panel {
        padding: 20px;
      }

      .status-grid,
      .source-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1 class="title">ツイート取得</h1>
      <p class="lead">期間を選んで、XアーカイブまたはX APIからツイートを取得します。</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} mb-3" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">保存済みツイート</div>
          <div class="status-value">{{ tweet_count }}</div>
        </div>
        <div class="status-item">
          <div class="status-label">未分析ツイート</div>
          <div class="status-value">{{ unanalyzed_count }}</div>
        </div>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="start_date" class="form-label">開始日</label>
            <input id="start_date" class="form-control form-control-lg" type="date" name="start_date" value="{{ start_date }}" required>
          </div>
          <div class="col-md-6">
            <label for="end_date" class="form-label">終了日</label>
            <input id="end_date" class="form-control form-control-lg" type="date" name="end_date" value="{{ end_date }}" required>
          </div>
        </div>

        <div class="form-label" id="source_label">取得方法</div>
        <div class="source-options" role="radiogroup" aria-labelledby="source_label">
          
          <div class="source-option">
            <input class="form-check-input" type="radio" name="source" id="source_archive" value="archive" checked>
            <label for="source_archive">
              <span class="source-title">Xアーカイブから取得</span>
              <span class="source-note">
                twimood/data/tweets.jsを使います。<br>
                X APIは使いません。</span>
            </label>
          </div>

          <div class="source-option">
            <input class="form-check-input" type="radio" name="source" id="source_api" value="api">
            <label for="source_api">
              <span class="source-title">X APIから取得</span>
              <span class="source-note">
                自分のIDとUser ID、Bearer Tokenを使います。<br>
                X API利用料金に注意してください。</span>
            </label>
          </div>

        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary btn-lg" id="get_data_button">
            <span class="button-label">選んだ方法でデータを取得</span>
          </button>
          <a class="btn btn-danger btn-lg" id="analyze_button" href="{% url 'analyze_tweets' %}">
            <span class="button-label">OpenAI APIで未分析ツイートを分析</span>
          </a>
        </div>

      </form>
    </section>
  </main>

  {% include "twimood/_navbar.html" %}

  <div class="loading-overlay" id="loading_overlay" aria-hidden="true">
    <p class="loading-message" id="loading_message">ツイートを取得中です…</p>
    <div class="loading-spinner"></div>
    <button type="button" class="btn btn-outline-secondary btn-lg loading-cancel" id="loading_cancel">キャンセル</button>
  </div>

  <script>
    const form = document.querySelector('form');
    const getDataButton = document.getElementById('get_data_button');
    const analyzeButton = document.getElementById('analyze_button');
    const loadingOverlay = document.getElementById('loading_overlay');
    const loadingMessage = document.getElementById('loading_message');
    const loadingCancel = document.getElementById('loading_cancel');

    function showLoading(button, mode) {
      button.classList.add('is-loading');
      button.setAttribute('aria-busy', 'true');
      loadingOverlay.classList.toggle('is-analyzing', mode === 'analyze');
      loadingMessage.textContent = mode === 'analyze'
        ? 'ツイートを分析中です…'
        : 'ツイートを取得中です…';
      loadingOverlay.classList.add('is-visible');
      loadingOverlay.setAttribute('aria-hidden', 'false');

      if (button.tagName === 'BUTTON') {
        button.disabled = true;
      } else {
        button.setAttribute('aria-disabled', 'true');
      }
    }

    function hideLoading() {
      window.stop();
      loadingOverlay.classList.remove('is-visible', 'is-analyzing');
      loadingOverlay.setAttribute('aria-hidden', 'true');

      getDataButton.classList.remove('is-loading');
      getDataButton.removeAttribute('aria-busy');
      getDataButton.disabled = false;

      analyzeButton.classList.remove('is-loading');
      analyzeButton.removeAttribute('aria-busy');
      analyzeButton.removeAttribute('aria-disabled');
    }

    form.addEventListener('submit', () => {
      showLoading(getDataButton, 'get-data');
    });

    analyzeButton.addEventListener('click', () => {
      showLoading(analyzeButton, 'analyze');
    });

    loadingCancel.addEventListener('click', hideLoading);
  </script>
</body>
</html>
