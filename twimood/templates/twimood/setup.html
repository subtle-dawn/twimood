<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twimood データ取得</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 76px;
      background: #f6f8fb;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .panel {
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .lead {
      color: #526174;
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .status-item {
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 14px 16px;
      background: #fbfcfe;
    }

    .status-label {
      color: #64748b;
      font-size: 0.9rem;
    }

    .status-value {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .source-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .source-options .btn {
      text-align: left;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .source-title {
      display: block;
      font-weight: 700;
    }

    .source-note {
      display: block;
      margin-top: 4px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 920px);
        padding-top: 20px;
      }

      .panel {
        padding: 20px;
      }

      .status-grid,
      .source-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1 class="title">いつからいつまでのデータを取得しますか？</h1>
      <p class="lead">期間を選んで、X APIまたはXアーカイブからツイートを読み込みます。</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} mb-3" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">保存済みツイート</div>
          <div class="status-value">{{ tweet_count }}</div>
        </div>
        <div class="status-item">
          <div class="status-label">未分析ツイート</div>
          <div class="status-value">{{ unanalyzed_count }}</div>
        </div>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="start_date" class="form-label">開始日</label>
            <input id="start_date" class="form-control form-control-lg" type="date" name="start_date" value="{{ start_date }}" required>
          </div>
          <div class="col-md-6">
            <label for="end_date" class="form-label">終了日</label>
            <input id="end_date" class="form-control form-control-lg" type="date" name="end_date" value="{{ end_date }}" required>
          </div>
        </div>

        <div class="source-options" role="group" aria-label="データ取得元">
          <input class="btn-check" type="radio" name="source" id="source_api" value="api" checked>
          <label class="btn btn-outline-primary" for="source_api">
            <span class="source-title">X APIから取得</span>
            <span class="source-note">自分のBearer TokenとUser IDを使います。API利用料金に注意してください。</span>
          </label>

          <input class="btn-check" type="radio" name="source" id="source_archive" value="archive">
          <label class="btn btn-outline-primary" for="source_archive">
            <span class="source-title">Xアーカイブから読み込み</span>
            <span class="source-note">twimood/data/tweets.jsを期間で絞り込みます。X APIは使いません。</span>
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary btn-lg">データを取得</button>
          <a class="btn btn-outline-secondary btn-lg" href="{% url 'calendar' %}">カレンダーを見る</a>
          <a class="btn btn-outline-secondary btn-lg" href="{% url 'graph' %}">グラフを見る</a>
          <a class="btn btn-outline-danger btn-lg" href="{% url 'analyze_tweets' %}">OpenAI APIで未分析を分析</a>
        </div>
      </form>
    </section>
  </main>

  {% include "twimood/_navbar.html" %}
</body>
</html>
